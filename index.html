@font-face{font-family:"Morrison";src:url(assets/fonts/morrison.woff2) format("woff2");font-display:swap}
:root{ --h2:clamp(28px,2.8vw,42px); --h3:clamp(20px,1.8vw,24px);
  --room:#030202; --cream:#FBF4E6; --cream-2:#E6D9C2; --cream-3:#B7A68D; --line:rgba(242,231,211,.12);
  --paper:#F6EFE1; --ink:#1B1410; --ink-2:#5C4B3D;
  --red:#B5372A; --mustard:#D8A13A; --teal:#2B6468; --edge:#E8862E; --film:#2a1a0f;
  --deco:"Morrison","Josefin Sans","Futura",sans-serif; --type:"IBM Plex Mono","Courier New",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .15 0 0 0 0 .1 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--room);color:var(--cream);font-family:var(--type);font-size:16px;line-height:1.7;letter-spacing:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;background:var(--grain);opacity:.28;pointer-events:none;z-index:90}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.caps{text-transform:uppercase;letter-spacing:.06em}

/* light */
#spot{position:fixed;inset:0;pointer-events:none;z-index:2;transition:background .2s;
  background:radial-gradient(circle var(--sr,420px) at var(--sx,50%) var(--sy,50%),rgba(255,224,176,.16),rgba(255,214,160,.05) 45%,transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55))}
body.dark-red #spot{background:radial-gradient(ellipse 60% 45% at 50% -6%,rgba(190,30,20,.34),transparent 70%),radial-gradient(circle var(--sr,360px) at var(--sx,50%) var(--sy,50%),rgba(255,226,190,.13),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.6))}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:50;height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(16px,3vw,36px);opacity:0;transition:opacity .8s;pointer-events:none;background:linear-gradient(180deg,rgba(14,10,8,.96),rgba(14,10,8,.88));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(242,231,211,.08)}
.light-top .top{background:rgba(246,239,225,.94);border-bottom-color:rgba(27,20,16,.12)}
.top.on{opacity:1;pointer-events:auto}
.mark{font-family:var(--deco);white-space:nowrap;font-size:clamp(15px,1.6vw,20px);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.top nav{display:flex;align-items:center;gap:clamp(12px,2vw,24px);font-size:14px;white-space:nowrap}
.top nav a,.top nav button{text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--cream-2);position:relative}
.top nav a:hover,.top nav button:hover{color:var(--cream)}
.top nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.top nav a:hover::after{transform:scaleX(1)}
.snd svg{width:20px;height:20px;display:block}
.light-top .top nav a,.light-top .top nav button{color:var(--ink-2)}
.light-top .top .mark{color:var(--ink)}

/* stage: intro + home */
#stage{position:fixed;inset:0;z-index:3;overflow:hidden;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#strip{position:absolute;inset:0;filter:drop-shadow(0 22px 16px rgba(0,0,0,.6)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.seg{position:absolute;left:0;top:0;will-change:transform;text-decoration:none;color:var(--cream);display:block}

.ph{position:absolute;overflow:hidden;background:var(--ph);transition:filter .3s;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4)}
.h .ph{left:2.3%;right:3.2%;top:17.5%;bottom:14.8%}
.v .ph{top:2.3%;bottom:3.2%;right:17.5%;left:14.8%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) saturate(1) contrast(1.06) brightness(.88);transition:filter .9s cubic-bezier(.4,0,.2,1)}
.seg:hover .ph img,.seg:focus-visible .ph img,.seg.lit .ph img{filter:grayscale(0) saturate(1.35) contrast(1.06) brightness(1.04);transition-duration:.35s}
.seg.dev .ph img{transition-duration:2.8s!important;transition-timing-function:cubic-bezier(.4,0,.3,1)!important}
.ph:has(img) .lab{z-index:3}.ph:has(img)::before{background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 38%),linear-gradient(160deg,rgba(255,160,70,.10),rgba(140,40,20,.08));mix-blend-mode:normal}
.ph::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(160deg,rgba(255,160,70,.14),rgba(140,40,20,.12));mix-blend-mode:multiply;pointer-events:none}
.ph::after{content:"";position:absolute;inset:0;z-index:2;background:var(--grain),radial-gradient(ellipse at center,transparent 55%,rgba(30,10,0,.45));opacity:.75;pointer-events:none}
.ph .lab{position:absolute;right:10px;bottom:8px;z-index:3;font-family:var(--type);font-size:14px;color:#fbf1de;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:.3px}
.et{position:absolute;font-family:var(--type);font-weight:700;font-size:10px;color:#3a1b08;opacity:.8;white-space:nowrap;letter-spacing:.06em}
.h .et.t{left:24%;top:.4%}.et.b{display:none}
.v .et{display:none}
.seg:hover .ph,.seg:focus-visible .ph{filter:brightness(1.08)}
#can::before{content:"";position:absolute;inset:-28px}

#can img{width:var(--CW);height:var(--CH)}
#leader{position:absolute;left:0;top:0;width:var(--lx);height:var(--ly);z-index:3;cursor:pointer;filter:drop-shadow(0 20px 14px rgba(0,0,0,.6))}
#leader img{width:var(--LW);height:var(--CH)}
.v #can img,.v #leader img{transform:translate(-50%,-50%) rotate(90deg)}
#can:focus-visible{outline:2px solid var(--mustard);outline-offset:6px;border-radius:12px}
.hint{position:fixed;left:0;right:0;bottom:clamp(22px,7vh,64px);z-index:6;margin:0;text-align:center;font-family:var(--type);font-size:12px;letter-spacing:.05em;color:var(--cream-3);pointer-events:none;padding:0 20px;opacity:0;transition:opacity 1s .6s}
.hint.on{opacity:1}
.can-hint{opacity:1;transition:opacity .4s;bottom:clamp(90px,17vh,170px);font-size:13px}.can-hint span::before,.can-hint span::after{content:none!important}.can-hint.gone{opacity:0}
.hint span{display:inline-block;padding:6px 4px;text-shadow:0 1px 10px rgba(0,0,0,.9);animation:drift 3.6s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:.78}}
@media (prefers-reduced-motion:reduce){.hint span{animation:none}}
@media (max-width:760px){.hint{font-size:11px}}

.skipbar{position:fixed;right:24px;bottom:22px;z-index:60;display:flex;gap:10px}
.pill{height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(242,231,211,.28);background:rgba(15,10,8,.6);color:var(--cream);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:14px;backdrop-filter:blur(6px);transition:background .2s}
.pill:hover{background:rgba(242,231,211,.1)}
.pill svg{width:18px;height:18px}

/* room pages */
#room{position:relative;z-index:5;min-height:100vh;padding:110px 40px 90px}
.rhead{max-width:1280px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--cream-2);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.back:hover{color:var(--cream)}
.back svg{width:18px;height:18px}
.rtitle{font-family:var(--deco);overflow-wrap:anywhere;font-size:clamp(40px,9vw,124px);line-height:.92;margin:14px 0 0;text-transform:uppercase;letter-spacing:.04em;font-weight:400}
.rtitle:focus{outline:none}
.lamp{width:70px;height:26px;border-radius:0 0 40px 40px;background:radial-gradient(ellipse at 50% 0%,#ff6a50,#a5150c 70%);box-shadow:0 10px 60px 20px rgba(200,30,20,.35);position:fixed;top:0;left:50%;margin-left:-35px;z-index:4}
.line-wrap{position:relative;max-width:1400px;margin:30px auto 0;height:min(64vh,560px)}
.wire{position:absolute;left:0;top:0;width:100%;height:120px;overflow:visible}
.wire path{fill:none}
.wire .cs{stroke:rgba(0,0,0,.55);stroke-width:3;filter:blur(2px);transform:translateY(9px)}
.wire .c1{stroke:#6f6152;stroke-width:4}
.wire .c2{stroke:url(#cord);stroke-width:4.5}
.hang{position:absolute;top:0;width:var(--pw);transform-origin:50% -15.5px;animation:swing var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s);cursor:pointer;border:0;background:none;padding:0;color:var(--ink);text-align:left}
@keyframes swing{0%,100%{transform:rotate(var(--a,-1.2deg))}50%{transform:rotate(calc(var(--a,-1.2deg) * -1))}}
.hang:hover{animation-duration:2.2s}
.hang:hover .pr{transform:translateY(-3px);box-shadow:0 30px 50px -16px rgba(0,0,0,.9)}
.hang span,.thumbs span,.case .big span{display:block}
.clip{position:absolute!important;left:50%;top:-22px;width:28px;height:92px;margin-left:-14px;z-index:3;filter:drop-shadow(2px 6px 4px rgba(0,0,0,.55))}
.hang .pr{margin-top:calc(52px + var(--jaw,0px))}
.pr{position:relative;background:url(assets/img/paper.jpg) 0 0/100% 100%;padding:7.5% 5.8% 25.3%;box-shadow:0 22px 40px -18px rgba(0,0,0,.85),0 2px 3px rgba(0,0,0,.4);transition:transform .3s var(--ease),box-shadow .3s}
.pr::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(200,40,25,.16),rgba(120,20,10,.08));mix-blend-mode:multiply;pointer-events:none}
.pr .img{position:relative;aspect-ratio:var(--ar,4/5);overflow:hidden;background:var(--ph)}
.pr .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) sepia(.1);transition:transform .5s var(--ease)}
.hang:hover .pr .img img{transform:scale(1.03)}
.pr .img::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.5}
.pr{container-type:inline-size}
.pr .cap{position:absolute;left:6%;right:6%;bottom:4%;height:15%;display:flex!important;align-items:center;font-family:var(--type);font-size:clamp(8px,6.2cqw,13px);color:#4a3a2c;line-height:1.2;overflow:hidden;overflow-wrap:anywhere}
.pr .cap>span{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr .typed{font-family:var(--deco);position:absolute;inset:0;display:flex!important;align-items:center;justify-content:center;padding:12%;text-align:center;font-size:clamp(12px,10.5cqw,30px);overflow-wrap:anywhere;line-height:1.1;text-transform:uppercase;letter-spacing:.06em;color:var(--t,#F2E7D3)}

/* case: developed print */
.case{max-width:1280px;margin:34px auto 0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(36px,5vw,80px);align-items:start}
.case .big{position:relative;background:url(assets/img/paper.jpg) 0 0/100% 100%;padding:5.8% 5.8% 16%;box-shadow:0 40px 70px -26px rgba(0,0,0,.95);transform:rotate(-1deg)}
.case .big .typed{font-family:var(--deco);position:absolute;inset:0;display:flex!important;align-items:center;justify-content:center;text-align:center;padding:10%;text-transform:uppercase;letter-spacing:.05em;line-height:1.05;color:var(--t,#F2E7D3)}
.case .big .img{position:relative;aspect-ratio:var(--ar,4/3);overflow:hidden;background:var(--ph,#e9e2d3)}
.case .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.develop img,.develop .typed{animation:develop 2.2s ease-out both}
@keyframes develop{0%{opacity:0;filter:sepia(1) brightness(1.6) contrast(.5)}35%{opacity:.35}100%{opacity:1;filter:sepia(.08)}}
.case .big .cap{position:absolute;left:16px;bottom:14px;font-family:var(--type);font-size:14px;color:var(--ink-2)}
.case .kind{font-size:14px;color:var(--cream-2);margin:0 0 10px}
.case h2{font-family:var(--deco);font-weight:400;font-size:var(--h2);line-height:1;margin:0 0 22px;text-transform:uppercase;letter-spacing:.04em}
.case p{color:#F1E7D6;margin:0 0 16px;max-width:60ch;font-size:16px}
.case ul.out{list-style:none;padding:0;margin:24px 0;border-top:1px solid var(--line)}
.case ul.out li{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.case ul.out li::before{content:"\2014";color:var(--edge);margin-right:12px}
.case .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;font-size:16px;text-decoration:none;cursor:pointer;border:1px solid rgba(242,231,211,.3);background:transparent;color:var(--cream);transition:background .2s,transform .2s var(--ease)}
.btn:hover{background:rgba(242,231,211,.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.btn.solid:hover{background:#fff}
.btn svg{width:16px;height:16px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;align-items:start}
.thumbs .pr{padding:5.8% 5.8% 12%}
.thumbs button{border:0;padding:0;background:none;cursor:pointer}
.casenav{max-width:1280px;margin:60px auto 0;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}
.casenav button{background:none;border:0;cursor:pointer;color:var(--cream-2);text-align:left;padding:0}
.casenav button.nx{text-align:right}
.casenav small{display:block;font-size:13px;color:var(--cream-3)}
.casenav span{font-family:var(--deco);font-size:var(--h3);text-transform:uppercase;letter-spacing:.05em;color:var(--cream)}
.casenav button:hover span{color:var(--mustard)}

/* about & contact */
.split{max-width:1280px;margin:40px auto 0;display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:clamp(40px,6vw,96px);align-items:start}
.split .big{transform:rotate(-2deg)}
.prose h2{font-family:var(--deco);font-weight:400;font-size:var(--h2);line-height:1.15;margin:0 0 22px}
.prose p{color:#F1E7D6;margin:0 0 18px;max-width:58ch}
.bio p{max-width:68ch}.bio-cta{text-align:right;margin-top:6px!important}.bio-cta a{font-size:14px;color:var(--cream-2);text-decoration:none;padding:6px 0;position:relative}.bio-cta a:hover{color:var(--cream)}.bio-cta a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}.bio-cta a:hover::after,.bio-cta a:focus-visible::after{transform:scaleX(1)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.facts dt{font-family:var(--type);font-size:13px;color:var(--cream-3)}
.facts dd{margin:4px 0 0}
.bizcard{aspect-ratio:1.75;padding:clamp(26px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-2deg);color:var(--ink);background:var(--fiber),linear-gradient(160deg,#fbf8f0,#efe7d6);box-shadow:0 1px 0 #d9cfba,0 2px 0 #cfc4ad,0 3px 0 #c4b89f,0 40px 70px -26px rgba(0,0,0,.95)}
.bizcard h3{font-family:var(--deco);font-weight:400;font-size:var(--h2);margin:0;line-height:1;text-transform:uppercase;letter-spacing:.05em}
.bizcard p{margin:6px 0 0;color:var(--ink-2);font-size:16px}
.bizcard .lines{font-family:var(--type);font-size:14px;line-height:1.7}
.bizcard .lines a{text-decoration:none;border-bottom:1px solid rgba(27,20,16,.3)}

/* recruiter */
#rec{position:relative;z-index:5;background:var(--paper);color:var(--ink);min-height:100vh;padding:110px 40px 90px}
#rec::before{content:"";position:absolute;inset:0;background:var(--fiber);pointer-events:none}
.rec{position:relative;max-width:1080px;margin:0 auto}
.rec-head{display:grid;grid-template-columns:150px 1fr;gap:36px;align-items:center;padding-bottom:40px;border-bottom:2px solid var(--ink)}
.rec-head img{width:150px;aspect-ratio:4/5;object-fit:cover;object-position:50% 50%}
.rec h1{font-family:var(--deco);font-weight:400;font-size:clamp(44px,5.4vw,76px);line-height:.95;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em}
.rec-head p{margin:0 0 16px;font-size:18px;color:var(--ink-2);max-width:56ch}
.rec .btn{border-color:rgba(27,20,16,.25);color:var(--ink)}.rec .btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rec section{display:grid;grid-template-columns:200px 1fr;gap:36px;padding:40px 0;border-bottom:1px solid rgba(27,20,16,.15)}
.rec h2{font-family:var(--deco);font-weight:400;font-size:var(--h3);margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.06em}
.rec .job{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:0 0 22px;margin-bottom:22px;border-bottom:1px dashed rgba(27,20,16,.15)}
.rec .job:last-child{border:0;margin:0;padding:0}
.rec .job h3{margin:0;font-size:16px;font-weight:700}
.rec .job .w{font-family:var(--type);font-size:14px;color:var(--ink-2)}
.rec .job .org{grid-column:1/3;color:var(--ink-2);margin:0 0 6px}
.rec .job ul{grid-column:1/3;margin:0;padding-left:18px}
.rec .projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.rec .proj{text-decoration:none;display:block}
.rec .proj .im{aspect-ratio:16/10;overflow:hidden;margin-bottom:10px;background:#ddd}
.rec .proj img{width:100%;height:100%;object-fit:cover;transition:transform .4s var(--ease)}
.rec .proj:hover img{transform:scale(1.03)}
.rec .proj h3{margin:0 0 2px;font-size:16px;font-weight:700}
.rec .proj p{margin:0;font-size:14px;color:var(--ink-2)}

@media (max-width:980px){
  .case,.split{grid-template-columns:1fr!important}
  .split>figure.case{max-width:280px;width:100%;justify-self:center}
  .line-wrap{height:auto;overflow-x:auto;overflow-y:visible;padding:34px 4px 40px;display:flex;gap:26px;scroll-snap-type:x mandatory;background:linear-gradient(#c8bba7,#c8bba7) 0 26px/100% 1px no-repeat}
  .line-wrap .wire{display:none}
  .hang{position:relative;left:auto!important;top:auto!important;flex:none;scroll-snap-align:center;--pw:min(220px,60vw)!important}
  .top .hide-m{display:none}
}
@media (max-width:600px){ .rw-t,.xl{display:none} }
@media (max-width:760px){
  .top{padding:0 16px;height:60px;background:linear-gradient(180deg,rgba(15,10,8,.95),rgba(15,10,8,.6) 70%,transparent)}.mark{font-size:14px;white-space:nowrap}.top nav{gap:14px;font-size:13px;white-space:nowrap}.top .hide-s{display:none}
  #room{padding:96px 18px 70px}
  .line-wrap{height:auto;overflow-x:auto;overflow-y:visible;padding:30px 0 40px;display:flex;gap:22px;scroll-snap-type:x mandatory}
  .line-wrap .wire{display:none}
  .line-wrap{background:linear-gradient(#c8bba7,#c8bba7) 0 22px/100% 1px no-repeat}
  .hang{position:relative;left:auto!important;top:auto!important;flex:none;scroll-snap-align:center}
  .case,.split,.rec section,.rec-head{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
}

.ccard-split{grid-template-columns:1.15fr 1fr!important;align-items:center}
.ccard{position:relative;transform:rotate(-2deg);background:url(assets/img/paper.jpg) 0 0/100% 100%;padding:4.2% 4.2% 0;box-shadow:0 40px 70px -26px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.5);container-type:inline-size;color:var(--ink)}
.cphoto{position:relative;aspect-ratio:3/2;overflow:hidden;background:#2a1a12}
.cphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) sepia(.08)}
.cphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(10,6,4,.55),rgba(10,6,4,0) 55%);pointer-events:none}
.cname{position:absolute;left:5%;top:6%;right:5%;z-index:2;color:var(--cream);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.cname h3{font-family:var(--deco);font-weight:400;font-size:clamp(20px,6.4cqw,42px);margin:0;line-height:1;text-transform:uppercase;letter-spacing:.05em}
.cname p{margin:.5em 0 0;font-size:clamp(11px,2.6cqw,16px);color:var(--cream-2)}
.clinks{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:4.6cqw 1cqw 5cqw;font-size:clamp(10px,2.5cqw,15px)}
.clinks a{color:#3a2c20;text-decoration:none;border-bottom:1px solid rgba(27,20,16,.3)}.clinks a:hover{color:#000;border-color:#000}
.ccard.over{padding-bottom:4.2%}.ccard.over .clinks{position:absolute;left:8%;right:8%;bottom:9%;padding:0;z-index:2}
.ccard.over .clinks a{color:var(--cream);border-color:rgba(251,244,230,.5);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.ccard.over .cphoto::after{background:linear-gradient(160deg,rgba(10,6,4,.55),rgba(10,6,4,0) 50%),linear-gradient(0deg,rgba(10,6,4,.6),rgba(10,6,4,0) 35%)}
.bio-cta a{display:inline-block;animation:drift 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bio-cta a{animation:none}}
@media (max-width:900px){.ccard-split{grid-template-columns:1fr!important}.clinks{font-size:12px}}
.orglogo{display:block;width:60px;height:60px;border-radius:14px;object-fit:cover;background:#fff;margin:0 0 16px;box-shadow:0 0 0 1px rgba(251,244,230,.18),0 8px 18px -8px rgba(0,0,0,.8)}
.img.logoimg{background:#f7f2e7!important}
.pr .img.logoimg img.lg,.case .big .img.logoimg img.lg{position:absolute;inset:0;margin:auto;width:auto;height:62%;aspect-ratio:1;object-fit:contain;border-radius:16%;filter:none;box-shadow:0 0 0 1px rgba(27,20,16,.1),0 6px 14px -8px rgba(27,20,16,.45)}
.hang:hover .pr .img.logoimg img.lg{transform:none}
.img.logoimg .typed.lgt{color:#2a1d14!important;font-size:clamp(11px,9cqw,26px)}
.case .big .img.logoimg .typed.lgt{font-size:clamp(26px,3vw,44px)}
/* intro prototypes */
#pre{position:fixed;inset:0;z-index:7;background:#030202}
#pre[hidden]{display:none}
.rig{position:absolute;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 30px 30px rgba(0,0,0,.65))}
.rig>img,.rig .cw{position:absolute;inset:0;width:100%;height:100%}
.rig .cw img{position:absolute;max-width:none}
.rig .cin img{filter:blur(1.1px) saturate(.92)}
.rig .cl{position:absolute;inset:auto;max-width:none;will-change:transform}
.rig:focus-visible{outline:2px solid var(--cream);outline-offset:8px;border-radius:16px}
.flcan{position:fixed;z-index:8;pointer-events:none;max-width:none;filter:drop-shadow(0 34px 26px rgba(0,0,0,.7))}
.cam{mix-blend-mode:lighten;position:absolute;left:50%;top:50%;width:max(min(64vw,780px),min(118vw,500px));transform:translate(-50%,-50%);border:0;padding:0;background:none;cursor:pointer}
.cam svg{display:block;width:100%;height:auto;overflow:visible;will-change:transform;-webkit-mask-image:radial-gradient(ellipse 52% 58% at 50% 48%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 52% 58% at 50% 48%,#000 62%,transparent 100%)}
.cam:focus-visible{outline:2px solid var(--cream);outline-offset:8px;border-radius:24px}
#preBlack{position:fixed;inset:0;z-index:10;background:#000;opacity:0;pointer-events:none}
#vf{position:fixed;inset:0;z-index:9;pointer-events:none}
#vf[hidden]{display:none}
.scene{position:fixed;left:0;top:0;width:100vw;height:100vh;object-fit:cover;max-width:none}
#scn{position:fixed;inset:0;z-index:8;pointer-events:none}#scn[hidden]{display:none}#scn img{width:100%;height:100%;object-fit:cover;display:block}
#vf .mask{position:absolute;inset:0;background:radial-gradient(ellipse 72% 68% at 50% 50%,transparent 62%,rgba(0,0,0,.92) 80%,#000 100%)}
#vf .frm{position:absolute;inset:9% 8%}

#vf .frm i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}#vf .frm i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#vf .frm i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}#vf .frm i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#vf .ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:1.5px solid rgba(251,244,230,.5)}
#vf .ring::after{content:"";position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:1.5px solid rgba(251,244,230,.6);background:linear-gradient(transparent 49%,rgba(251,244,230,.5) 49% 51%,transparent 51%)}
#vf .read{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:13px;letter-spacing:.2em;color:#9fd27a;text-shadow:0 0 8px rgba(120,220,90,.6)}
#vf .flash{position:absolute;inset:0;background:#fff;opacity:0}
.introsw{position:fixed;left:24px;top:20px;flex-wrap:wrap;z-index:60;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--cream-3)}
.introsw button{font:inherit;font-size:12px;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(242,231,211,.22);background:rgba(15,10,8,.6);color:var(--cream-2);cursor:pointer}
.introsw button[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.introsw[hidden]{display:none}

.tscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;overflow:hidden;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(70,45,30,.35),transparent 75%)}
.tscreen .leak{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 30% 45% at 96% 12%,rgba(255,140,60,.22),transparent 70%),radial-gradient(ellipse 22% 35% at 2% 92%,rgba(220,80,40,.14),transparent 70%);animation:leak 9s ease-in-out infinite alternate;mix-blend-mode:screen}

function abortPre(){ preGen++; preBusy=false; [pre,vf,preBlack,document.getElementById("scn")].forEach(e=>e&&e.getAnimations({subtree:true}).forEach(a=>a.cancel())); vf.hidden=true; preBlack.style.opacity=""; segs.forEach(x=>x.el.classList.remove("dev")); litG=null; preClear(); }

function startContainer(){
  preOn=true; pre.hidden=false; can.hidden=true; leader.hidden=true; stripEl.style.visibility="hidden";
  const H=Math.min(innerHeight*.58,540), k=H/675, W=385*k, f=290/768;
  const L=innerWidth/2-191*k, T=innerHeight/2-H/2-10;
  const cl=(257-60-463*f)*k, ct=(730-100-1472*f)*k, cw=848*f*k, ch=1515*f*k;
  const cx=197,cy=95,rx=157,ry=42, P=(x,y)=>`${(x/385*100).toFixed(2)}% ${(y/675*100).toFixed(2)}%`, curve=[];
  for(let i=0;i<=24;i++){ const x=cx-rx+2*rx*i/24; curve.push(P(x,cy+ry*Math.sqrt(Math.max(0,1-((x-cx)/rx)**2)))); }
  const cin=`polygon(${[P(-20,cy),...curve,P(405,cy),P(405,700),P(-20,700)].join(",")})`;
  const cout=`polygon(${[P(-20,-3000),P(405,-3000),P(405,cy),...curve.slice().reverse(),P(-20,cy)].join(",")})`;
  const cimg=`<img class="cn" src="assets/img/canister.png" alt="" draggable="false" style="left:${cl}px;top:${ct}px;width:${cw}px;height:${ch}px">`;
  pre.innerHTML=`<button class="rig" type="button" aria-label="Open the film container" style="left:${L}px;top:${T}px;width:${W}px;height:${H}px">
    <img class="cb" src="assets/img/cont-back.png" alt="" draggable="false">
    <span class="cw cin" style="clip-path:${cin}">${cimg}</span><span class="cw cout" style="clip-path:${cout}">${cimg}</span>
    <img class="cf" src="assets/img/cont-front.png" alt="" draggable="false">
    <img class="cl" src="assets/img/cont-lid.png" alt="" draggable="false" style="left:${-2*k}px;top:${5*k}px;width:${390*k}px;height:${175*k}px"></button>`;
  const rig=pre.querySelector(".rig"); light(innerWidth/2,innerHeight/2,420);
  hintUnder({bottom:T+H},"Click to open");
  rig.addEventListener("click",()=>runContainer(rig,{k,W,H,L,T,cw,ch,ct:ct+43*f*k}));
}
async function runContainer(rig,g){
  if(preBusy) return; preBusy=true; document.getElementById("canHint").classList.add("gone"); introsw.hidden=true; S.pop();
  const lid=rig.querySelector(".cl"), cans=[...rig.querySelectorAll(".cn")], ease="cubic-bezier(.45,.05,.25,1)";
  lid.animate([{transform:"translate(0,0) rotate(0deg)"},{transform:`translate(0,${-g.H*.12}px) rotate(-5deg)`,offset:.3},{transform:`translate(${g.W*1.1}px,${-g.H*.55}px) rotate(32deg)`,opacity:0}],{duration:reduce?1:950,easing:"cubic-bezier(.3,.6,.35,1)",fill:"forwards"});
  await after(320); S.wind(900);
  const rise=(630-137+24)*g.k;
  cans.forEach(c=>c.animate([{transform:"translateY(0)"},{transform:`translateY(${-rise}px)`}],{duration:reduce?1:1150,easing:ease,fill:"forwards"}));
  const drop=Math.min(innerHeight*.7,Math.max(0,Math.max(24,innerHeight*.1)-(g.T+g.ct-rise)));
  rig.animate([{transform:"translateY(0)"},{transform:`translateY(${drop}px)`}],{duration:reduce?1:1150,easing:ease,fill:"forwards"});
  await after(1180);
  const r=rig.querySelector(".cout .cn").getBoundingClientRect();
  const fl=document.createElement("img"); fl.className="flcan"; fl.src="assets/img/canister.png"; fl.alt="";
  Object.assign(fl.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"}); document.body.appendChild(fl);
  cans.forEach(c=>c.style.visibility="hidden");
  const rig2=rig.querySelectorAll(".cb,.cf"); rig2.forEach(e=>e.animate([{transform:"translateY(0)",opacity:1},{transform:`translateY(${g.H*.45}px)`,opacity:0}],{duration:reduce?1:700,easing:"cubic-bezier(.5,0,.75,0)",fill:"forwards"}));
  can.hidden=false; can.style.visibility="hidden"; const R=can.querySelector("img").getBoundingClientRect();
  const dx=R.left-r.left, dy=R.top-r.top, s=R.width/r.width;
  fl.style.transformOrigin="0 0";
  await fl.animate([{transform:"none"},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],{duration:reduce?1:750,easing:ease,fill:"forwards"}).finished;
  can.style.visibility=""; fl.remove(); pre.hidden=true; leader.hidden=false; stripEl.style.visibility="";
  const li=leader.querySelector("img"); if(li) li.animate([{transform:"translate(-50%,-50%) translateX(-55%)",opacity:0},{transform:"translate(-50%,-50%)",opacity:1}],{duration:reduce?1:420,easing:"cubic-bezier(.2,.7,.2,1)"});
  S.tick(.14); await after(520);
  preOn=false; preBusy=false; openCan();
}

function camSVG(){ return `<svg viewBox="0 0 1376 768" aria-hidden="true">
<image class="camimg" href="assets/img/camera.jpg" x="0" y="0" width="1376" height="768"/>
<rect class="eyeglass" x="615" y="232" width="132" height="96" rx="13" fill="transparent"/>
</svg>`; }
function dust(cv){
  const ctx=cv.getContext("2d"); let W,H,ps=[],raf; const dpr=Math.min(2,devicePixelRatio||1);
  function size(){ W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); for(let i=0;i<140;i++) ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*.5+.1,vx:(Math.random()-.5)*.08,vy:-(Math.random()*.12+.03),t:Math.random()*6});
  function fr(){ ctx.clearRect(0,0,W,H); for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.t+=.01; if(p.y<-4){p.y=H+4;p.x=Math.random()*W} const a=p.a*(.6+.4*Math.sin(p.t)); ctx.fillStyle=`rgba(255,226,186,${a})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); } if(!reduce) raf=requestAnimationFrame(fr); }
  fr(); return ()=>cancelAnimationFrame(raf);
}
let stopDust=null;
function startCamera(){
  preOn=true; pre.hidden=false; can.hidden=true; leader.hidden=true; stripEl.style.visibility="hidden"; document.getElementById("canHint").classList.add("gone");
  pre.innerHTML=`<div class="tscreen"><div class="leak" aria-hidden="true"></div><div class="brk" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="meter" aria-hidden="true">ISO 2007&nbsp;&nbsp;&nbsp;1/29&nbsp;&nbsp;&nbsp;10003</div><h1 class="t-name">Catherine Tsang</h1><button class="t-go" type="button"><span class="dot"></span>Look through the lens</button></div>
    <div class="cam" aria-hidden="true" style="opacity:0;visibility:hidden">${camSVG()}<span class="sheen" style="--w:16"></span><span class="sheen" style="--w:9"></span><span class="sheen" style="--w:4"></span></div>`;
  light(innerWidth/2,innerHeight/2,620);
  const ts=pre.querySelector(".tscreen"); [...ts.children].slice(3).forEach((e,i)=>e.animate([{opacity:0,filter:i?"blur(4px)":"blur(18px)"},{opacity:.85,filter:i?"blur(2px)":"blur(7px)",offset:.55},{opacity:1,filter:"blur(0)"}],{duration:reduce?1:(i?1200:2200),delay:reduce?0:200+i*1500,easing:"cubic-bezier(.2,.7,.2,1)",fill:"backwards"}));
  const go=()=>runCamera(); pre.querySelector(".t-go").addEventListener("click",go);
  const kd=e=>{ if(e.key==="Enter"&&preOn&&!preBusy&&VAR==="camera"&&pre.querySelector(".t-go")){ e.preventDefault(); go(); } }; addEventListener("keydown",kd); pre._kd=kd;
}
async function runCamera0(){
  const g0=preGen, ok=()=>{ if(g0!==preGen) throw "abort"; };
  if(preBusy) return; preBusy=true; introsw.hidden=true; if(pre._kd) removeEventListener("keydown",pre._kd); S.tick(.14);
  const ts=pre.querySelector(".tscreen"), b=pre.querySelector(".cam"), svg=b.querySelector("svg"), E="cubic-bezier(.65,0,.35,1)";
  /* 1. name screen drifts toward you and dissolves; camera fades up behind it */
  ts.animate([{opacity:1,transform:"scale(1)",filter:"blur(0)"},{opacity:0,transform:"scale(1.08)",filter:"blur(10px)"}],{duration:reduce?1:1100,easing:E,fill:"forwards"});
  b.style.visibility="visible";
  /* the camera turns toward you out of the dark while a light passes across the chrome */
  const base="translate(-50%,-50%) perspective(1600px)";
  b.animate([{opacity:0,transform:`${base} translateZ(-220px) rotateY(-10deg) rotateX(4deg)`,filter:"brightness(.4) blur(3px)"},
             {opacity:1,transform:`${base} translateZ(-120px) rotateY(-6deg) rotateX(2.5deg)`,filter:"brightness(.8) blur(0)",offset:.25},
             {opacity:1,transform:`${base} translateZ(0) rotateY(0) rotateX(0)`,filter:"brightness(1) blur(0)"}],
            {duration:reduce?1:2400,delay:reduce?0:400,easing:"cubic-bezier(.22,.7,.18,1)",fill:"forwards"});
  b.querySelectorAll(".sheen").forEach(sh=>{ const w=+sh.style.getPropertyValue("--w"), band=x=>`polygon(${x-w}% 0,${x+w}% 0,${x+w-14}% 100%,${x-w-14}% 100%)`;
    sh.animate([{opacity:0,clipPath:band(-20)},{opacity:.42,offset:.15},{opacity:.42,offset:.8},{opacity:0,clipPath:band(135)}],{duration:reduce?1:1900,delay:reduce?0:1100,easing:"cubic-bezier(.45,.05,.4,1)",fill:"forwards"}); });
  await after(3100); if(stopDust) stopDust();
  /* 2. one continuous dolly into the eyepiece: exponential scale so the speed feels constant */
  const r=b.getBoundingClientRect(), ex=r.left+r.width*.4949, ey=r.top+r.height*.3646, dx=innerWidth/2-ex, dy=innerHeight/2-ey;
  svg.style.transformOrigin="49.49% 36.46%"; S.wind(2400);
  const N=40, Smax=34, kf=[];
  for(let i=0;i<=N;i++){ const t=i/N, e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, sc=Math.exp(Math.log(Smax)*Math.pow(e,1.15)), m=Math.min(1,e*1.6);
    kf.push({transform:`translate(${dx*m}px,${dy*m}px) scale(${sc})`}); }
  const D=reduce?1:2700;
  svg.animate(kf,{duration:D,easing:"linear",fill:"forwards"});
  const glass=svg.querySelector(".eyeglass"), scn=document.getElementById("scn"), sci=scn.firstElementChild;
  scn.hidden=false; let follow=true;
  (function clipLoop(){ if(!follow) return; const q=glass.getBoundingClientRect(), rad=13*q.width/132;
    scn.style.clipPath=`inset(${q.top}px ${innerWidth-q.right}px ${innerHeight-q.bottom}px ${q.left}px round ${rad}px)`; requestAnimationFrame(clipLoop); })();
  sci.animate([{opacity:0,filter:"brightness(.5)"},{opacity:0,filter:"brightness(.5)",offset:.6},{opacity:1,filter:"brightness(.85)",offset:.78},{opacity:1,filter:"brightness(1)"}],{duration:D,fill:"forwards"});
  const deco=[...vf.querySelectorAll(".frm,.ring,.read")];
  await after(D*.74);
  deco.forEach(e=>e.style.opacity=1); vf.hidden=false;
  const FOC=reduce?1:900;
  vf.querySelectorAll(".frm,.read").forEach(e=>e.animate([{opacity:0,filter:"blur(6px)",transform:"scale(1.04)"},{opacity:1,filter:"blur(0)",transform:"scale(1)"}],{duration:FOC,easing:"cubic-bezier(.2,.7,.2,1)",fill:"forwards"}));
  const ring=vf.querySelector(".ring");
  ring.animate([{opacity:0,filter:"blur(6px)",transform:"scale(1.35)"},{opacity:1,filter:"blur(0)",transform:"scale(.94)",offset:.75},{opacity:1,filter:"blur(0)",transform:"scale(1)"}],{duration:FOC+200,easing:"cubic-bezier(.2,.7,.2,1)",fill:"forwards"});
  await after(D*.26+40); follow=false; scn.style.clipPath="none";
  pre.hidden=true; pre.innerHTML="";
  await after(FOC*.5); S.tick(.1);
  await after(1300); S.shutter();
  /* flash, then fade to black */
  const fl=vf.querySelector(".flash");
  await fl.animate([{opacity:0},{opacity:1,offset:.12},{opacity:1,offset:.3},{opacity:0}],{duration:reduce?1:1400,easing:"ease-out",fill:"forwards"}).finished; ok();
  await preBlack.animate([{opacity:0},{opacity:1}],{duration:reduce?1:700,easing:"ease-in",fill:"forwards"}).finished; ok();
  /* behind the black: the strip, About me centred, its frame holding the shot in black and white */
  vf.hidden=true; scn.hidden=true; vf.getAnimations({subtree:true}).forEach(a=>a.cancel()); fl.getAnimations().forEach(a=>a.cancel()); sci.getAnimations().forEach(a=>a.cancel());
  stripEl.style.visibility=""; toHome(true); const keep=target; target=0; speed=0;
  const ai=SECTIONS.findIndex(x=>x.key==="about");
  const g=ai-1; offset=g*G.P+G.P/2-G.w/2; segs.forEach(x=>x.g=null); layout();
  const seg=segs.find(x=>x.g===g), im=seg&&seg.el.querySelector(".ph img");
  if(seg) seg.el.classList.add("dev");
  await after(250);
  preBlack.getAnimations().forEach(a=>a.cancel()); preBlack.style.opacity=1;
  await preBlack.animate([{opacity:1},{opacity:0}],{duration:reduce?1:1500,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"}).finished; ok();
  preBlack.getAnimations().forEach(a=>a.cancel()); preBlack.style.opacity="";
  /* the colour comes up */
  litG=g; litOff=offset; layout(); await after(1500);
  deco.forEach(e=>e.style.opacity="");
  target=keep; preOn=false; preBusy=false;
  if(seg){ const el=seg.el; (function w(){ if(litG!==null) return setTimeout(w,200); setTimeout(()=>el.classList.remove("dev"),3200); })(); }
}
function runCamera(){ return runCamera0().catch(e=>{ if(e!=="abort") throw e; }); }
